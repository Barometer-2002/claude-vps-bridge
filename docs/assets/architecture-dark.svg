<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">T3 Claude VPS 的运行位置和数据流（深色版）</title>
  <desc id="desc">Windows 端 T3 Code 的 claudeAgent 通过 SSH 连接 VPS 上的官方 Claude Code，转发会话消息与工具请求。Windows 执行项目操作并返回工具结果。</desc>
  <defs>
    <linearGradient id="archBgD" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131211"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <marker id="mTerraD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7Z" fill="#EB8E6C"/>
    </marker>
    <marker id="mSageD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7Z" fill="#4ADE80"/>
    </marker>
    <marker id="mStoneD" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0.8 0.8L6.2 3.5L0.8 6.2Z" fill="#9A948A"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0.75" y="0.75" width="1278.5" height="638.5" rx="20" fill="url(#archBgD)" stroke="#2A2825" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" fill="#F2EFE9">
    <!-- HEADER -->
    <text x="40" y="45" font-size="22" font-weight="750" letter-spacing="-0.4" fill="#F6F4EF">运行位置与数据流</text>
    <text x="40" y="69" font-size="13.5" fill="#9E988E">Claude Code 从 Linux VPS 发起模型请求，Windows 执行项目读写、构建与本机 MCP 调用</text>

    <rect x="970" y="29" width="270" height="32" rx="16" fill="#1A1917" stroke="#312E2A"/>
    <circle cx="988" cy="45" r="3.5" fill="#4ADE80"/>
    <text x="1000" y="49.5" font-size="12.5" font-weight="600" fill="#E6E3DC">Windows 发起 SSH 连接</text>

    <line x1="40" y1="88" x2="1240" y2="88" stroke="#252320" stroke-width="1"/>

    <!-- ZONE 1: WINDOWS HOST (x=40..492, w=452) -->
    <rect x="40" y="108" width="452" height="450" rx="16" fill="#171614" stroke="#2B2926" stroke-width="1.2"/>
    <rect x="60" y="128" width="10" height="10" rx="2.5" fill="#4ADE80"/>
    <text x="78" y="138" font-size="16" font-weight="750" fill="#F5F3EE">Windows 本机</text>
    <text x="472" y="137" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#8C877D">NATIVE LOCAL EXPERIENCE</text>
    <line x1="60" y1="152" x2="472" y2="152" stroke="#24221F" stroke-width="1"/>

    <!-- Card 1A: Native Shim (Inset Floating Terracotta Accent Pill) -->
    <rect x="60" y="166" width="412" height="86" rx="11" fill="#1E1C1A" stroke="#3D2B24" stroke-width="1.2"/>
    <rect x="68" y="176" width="3.5" height="66" rx="1.75" fill="#E07E5C"/>
    <text x="82" y="191" font-size="15.5" font-weight="750" fill="#FAF8F4">Claude VPS</text>
    <rect x="176" y="175" width="66" height="21" rx="10.5" fill="#2D1D17" stroke="#5D3526"/>
    <text x="209" y="189.5" text-anchor="middle" font-size="11" font-weight="700" fill="#F29E7E">原生接入</text>
    <text x="456" y="190" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600" fill="#928D83">T3 Code</text>
    <text x="82" y="214" font-size="12.5" fill="#CFCAC0">t3-native/ 独立实例 · 不修改 T3 与本机 ~/.claude</text>
    <text x="82" y="236" font-size="12" fill="#9A948A">原生权限审批 · 读图预览回映射 · 本地 Skills / MCP 透明可用</text>

    <!-- Card 1B: CodexHost Upstream Compatibility (Inset Floating Stone Accent Pill) -->
    <rect x="60" y="264" width="412" height="82" rx="11" fill="#1D1C1A" stroke="#302E2A" stroke-width="1.2"/>
    <rect x="68" y="274" width="3.5" height="62" rx="1.75" fill="#8C877D"/>
    <text x="82" y="289" font-size="15.5" font-weight="750" fill="#FAF8F4">CodexHost 插件兼容</text>
    <rect x="234" y="273" width="68" height="21" rx="10.5" fill="#272522" stroke="#3E3B36"/>
    <text x="268" y="287.5" text-anchor="middle" font-size="11" font-weight="600" fill="#CFCAC0">可选共存</text>
    <text x="456" y="288" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="600" fill="#928D83">plugin.mjs</text>
    <text x="82" y="311" font-size="12.5" fill="#CFCAC0">plugin/ 协议 3 多路复用 · 上游 CodexHost 0.20.0+ 完整兼容</text>
    <text x="82" y="332" font-size="12" fill="#9A948A">共用核心工作区运行时与多线路 SSH · 支持纯 T3 独立安装</text>

    <!-- Card 1C: Shared Security & Runtime Layer (Subtle Sage Accent) -->
    <rect x="60" y="360" width="412" height="84" rx="11" fill="#14201B" stroke="#234234" stroke-width="1.2"/>
    <text x="78" y="384" font-size="13.5" font-weight="750" fill="#6EE7B7">本机安全策略与工作区运行时</text>
    <text x="78" y="406" font-size="12.5" fill="#B6D7C8">• mcp-policy + LocalMcpHub：检查并代理 MCP 调用</text>
    <text x="78" y="427" font-size="12.5" fill="#B6D7C8">• workspace-runtime：读写 / 搜索 / Hooks / 长任务取消与查回</text>

    <!-- Bottom 2x2 Capability Chips -->
    <rect x="60" y="458" width="200" height="36" rx="8" fill="#1E1D1B" stroke="#2F2D29"/>
    <text x="160" y="481" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DDD9D0">项目源码 · CLAUDE.md · Skills</text>

    <rect x="272" y="458" width="200" height="36" rx="8" fill="#1E1D1B" stroke="#2F2D29"/>
    <text x="372" y="481" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DDD9D0">PowerShell · 构建 · GPU</text>

    <rect x="60" y="504" width="200" height="36" rx="8" fill="#1E1D1B" stroke="#2F2D29"/>
    <text x="160" y="527" text-anchor="middle" font-size="12" font-weight="600" fill="#DDD9D0">T3 &amp; 自定义 HTTP / Stdio MCP</text>

    <rect x="272" y="504" width="200" height="36" rx="8" fill="#1E1D1B" stroke="#2F2D29"/>
    <text x="372" y="527" text-anchor="middle" font-size="12.5" font-weight="600" fill="#DDD9D0">Playwright 浏览器（可选）</text>

    <!-- CENTER CORRIDOR: TRUST BOUNDARY & SSH TUNNEL (x=492..692, center=592) -->
    <line x1="592" y1="112" x2="592" y2="554" stroke="#33302C" stroke-width="1.5" stroke-dasharray="4 5"/>
    <rect x="550" y="110" width="84" height="24" rx="12" fill="#181715" stroke="#33302C"/>
    <text x="592" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#9A948A">信任边界</text>

    <!-- Flow 1: Windows -> VPS (y=232) -->
    <path d="M492 232H685" stroke="#EB8E6C" stroke-width="2" marker-end="url(#mTerraD)"/>
    <rect x="512" y="217" width="160" height="30" rx="15" fill="#1C1614" stroke="#593527" stroke-width="1.2"/>
    <text x="592" y="236.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F4A78B">stream-json / 工具结果</text>

    <!-- Flow 2: VPS -> Windows (y=310) -->
    <path d="M692 310H499" stroke="#4ADE80" stroke-width="2" marker-end="url(#mSageD)"/>
    <rect x="512" y="295" width="160" height="30" rx="15" fill="#131F1A" stroke="#254C3B" stroke-width="1.2"/>
    <text x="592" y="314.5" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7">工作区读写 / MCP 回调</text>

    <!-- SSH Tunnel Checkpoint Card -->
    <rect x="514" y="378" width="156" height="96" rx="12" fill="#1A1917" stroke="#34312D" stroke-width="1.2"/>
    <text x="592" y="405" text-anchor="middle" font-size="13.5" font-weight="750" fill="#F5F3EE">单条免密 SSH</text>
    <text x="592" y="425" text-anchor="middle" font-size="11.5" fill="#9A948A">Windows 主动发起</text>
    <rect x="528" y="438" width="128" height="24" rx="7" fill="#23211E" stroke="#383530"/>
    <text x="592" y="454" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#CFCAC0">direct · SOCKS5 · CF</text>

    <!-- ZONE 2: LINUX x64 VPS (x=692..1026, w=334) -->
    <rect x="692" y="108" width="334" height="450" rx="16" fill="#171614" stroke="#2B2926" stroke-width="1.2"/>
    <rect x="712" y="128" width="10" height="10" rx="2.5" fill="#E07E5C"/>
    <text x="730" y="138" font-size="16" font-weight="750" fill="#F5F3EE">Linux x64 VPS</text>
    <text x="1006" y="137" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#EB8E6C">REMOTE RUNTIME</text>
    <line x1="712" y1="152" x2="1006" y2="152" stroke="#24221F" stroke-width="1"/>

    <!-- Official Claude Code CLI Card -->
    <rect x="712" y="166" width="294" height="118" rx="12" fill="#201815" stroke="#4D3025" stroke-width="1.2"/>
    <g transform="translate(736 192)" stroke="#EB8E6C" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-5.2" x2="0" y2="5.2"/>
      <line x1="-4.5" y1="-2.6" x2="4.5" y2="2.6"/>
      <line x1="4.5" y1="-2.6" x2="-4.5" y2="2.6"/>
    </g>
    <text x="752" y="198" font-size="16.5" font-weight="750" fill="#FAF8F4">官方 Claude Code CLI</text>
