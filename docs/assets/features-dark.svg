<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="716" viewBox="0 0 1280 716" role="img" aria-label="T3 Claude VPS 核心能力"><title>T3 Claude VPS 核心能力</title><desc>官方协议直通、本机执行、本机 MCP 代理、读图与附件、本机 Skills 与 Commands、多线路 SSH、T3 原生工具卡片、标准 ACP 包装器和上游兼容。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="716" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1A1916"/><stop offset="1" stop-color="#24221E"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E58A6B" stop-opacity="0.22"/><stop offset="1" stop-color="#E58A6B" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#34312C"/></pattern><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/></filter><marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#E58A6B"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#4FB58C"/></marker></defs><rect width="1280" height="716" rx="24" fill="url(#bg)"/><rect width="1280" height="716" rx="24" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1279" height="715" rx="24" fill="none" stroke="#3B3833"/><g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif"><text x="48" y="66" font-size="32" font-weight="800" fill="#F4F1EA">核心能力</text><text x="48" y="98" font-size="17" font-weight="400" fill="#C4BEB0">模型与登录在 VPS，项目、工具和凭据在 Windows</text><rect x="40" y="132" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="90" cy="184" r="27" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><g transform="translate(90 184)"><path d="M-12,-5 H10 M5,-10 L10,-5 L5,0 M12,6 H-10 M-5,1 L-10,6 L-5,11" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="132" y="191" font-size="21" font-weight="800" fill="#F4F1EA">官方协议直通</text><text x="68" y="244" font-size="15.5" font-weight="400" fill="#C4BEB0">T3 自带的额度显示、权限审批、</text><text x="68" y="270" font-size="15.5" font-weight="400" fill="#C4BEB0">自动标题和 --resume 会话直接可用</text><rect x="448" y="132" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="498" cy="184" r="27" fill="#1F332B" stroke="#2F5A48" stroke-width="1.2"/><g transform="translate(498 184)"><path d="M-11,-8 L-3,0 L-11,8 M1,9 H12" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540" y="191" font-size="21" font-weight="800" fill="#F4F1EA">本机执行</text><text x="476" y="244" font-size="15.5" font-weight="400" fill="#C4BEB0">文件读写、搜索、PowerShell、构建</text><text x="476" y="270" font-size="15.5" font-weight="400" fill="#C4BEB0">都在 Windows 执行，不同步整份项目</text><rect x="856" y="132" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="906" cy="184" r="27" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><g transform="translate(906 184)"><path d="M0,-13 L11,-8 V1 C11,8 5,12 0,14 C-5,12 -11,8 -11,1 V-8 Z M-4,1 L-1,4 L5,-3" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="948" y="191" font-size="21" font-weight="800" fill="#F4F1EA">本机 MCP 代理</text><text x="884" y="244" font-size="15.5" font-weight="400" fill="#C4BEB0">T3 内置与自定义 MCP 在 Windows 运行，</text><text x="884" y="270" font-size="15.5" font-weight="400" fill="#C4BEB0">调用前本机检查权限，Token 不上 VPS</text><rect x="40" y="324" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="90" cy="376" r="27" fill="#1F332B" stroke="#2F5A48" stroke-width="1.2"/><g transform="translate(90 376)"><rect x="-12" y="-10" width="24" height="20" rx="3" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-5" cy="-3" r="2.5" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12,8 L-4,0 L2,5 L6,1 L12,8" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="132" y="383" font-size="21" font-weight="800" fill="#F4F1EA">读图与附件</text><text x="68" y="436" font-size="15.5" font-weight="400" fill="#C4BEB0">远端 .bridge-media 路径映射回</text><text x="68" y="462" font-size="15.5" font-weight="400" fill="#C4BEB0">Windows 原始路径，读图卡片正常显示</text><rect x="448" y="324" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="498" cy="376" r="27" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><g transform="translate(498 376)"><path d="M0,-13 L3.5,-3.5 L13,0 L3.5,3.5 L0,13 L-3.5,3.5 L-13,0 L-3.5,-3.5 Z" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540" y="383" font-size="21" font-weight="800" fill="#F4F1EA">本机 Skills / Commands</text><text x="476" y="436" font-size="15.5" font-weight="400" fill="#C4BEB0">发送 /skill、$skill、/command 时</text><text x="476" y="462" font-size="15.5" font-weight="400" fill="#C4BEB0">展开 Windows 本机 .claude 目录</text><rect x="856" y="324" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="906" cy="376" r="27" fill="#1F332B" stroke="#2F5A48" stroke-width="1.2"/><g transform="translate(906 376)"><path d="M-12,0 H-2 M-2,0 C4,0 4,-9 10,-9 H12 M-2,0 H12 M-2,0 C4,0 4,9 10,9 H12" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="948" y="383" font-size="21" font-weight="800" fill="#F4F1EA">多线路 SSH</text><text x="884" y="436" font-size="15.5" font-weight="400" fill="#C4BEB0">direct / SOCKS5 / cloudflared 自动切换，</text><text x="884" y="462" font-size="15.5" font-weight="400" fill="#C4BEB0">断线后按原请求编号恢复，不盲目重放</text><rect x="40" y="516" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="90" cy="568" r="27" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><g transform="translate(90 568)"><rect x="-12" y="-12" width="24" height="7" rx="2" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-12" y="-2" width="24" height="7" rx="2" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-12" y="8" width="16" height="5" rx="2" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="132" y="575" font-size="21" font-weight="800" fill="#F4F1EA">T3 原生工具卡片</text><rect x="319.31999999999994" y="530" width="84.68" height="24" rx="12" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><text x="361.65999999999997" y="546.2" font-size="12" font-weight="600" fill="#F0A58A" text-anchor="middle">v1.1.0 新增</text><text x="68" y="628" font-size="15.5" font-weight="400" fill="#C4BEB0">把 windows-workspace 结果呈现为</text><text x="68" y="654" font-size="15.5" font-weight="400" fill="#C4BEB0">Read、Grep、Glob、Bash、Edit、Write</text><rect x="448" y="516" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="498" cy="568" r="27" fill="#1F332B" stroke="#2F5A48" stroke-width="1.2"/><g transform="translate(498 568)"><rect x="-13" y="-6" width="15" height="12" rx="6" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-2" y="-6" width="15" height="12" rx="6" fill="none" stroke="#4FB58C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540" y="575" font-size="21" font-weight="800" fill="#F4F1EA">标准 ACP 包装器</text><rect x="727.3199999999999" y="530" width="84.68" height="24" rx="12" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><text x="769.66" y="546.2" font-size="12" font-weight="600" fill="#F0A58A" text-anchor="middle">v1.1.0 新增</text><text x="476" y="628" font-size="15.5" font-weight="400" fill="#C4BEB0">基于锁定版本的官方 claude-agent-acp，</text><text x="476" y="654" font-size="15.5" font-weight="400" fill="#C4BEB0">供支持 ACP 的客户端使用</text><rect x="856" y="516" width="384" height="168" rx="20" fill="#2C2A26" stroke="#3B3833" stroke-width="1.2" filter="url(#sh)"/><circle cx="906" cy="568" r="27" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><g transform="translate(906 568)"><rect x="-12" y="-12" width="24" height="24" rx="6" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5,0 L-1,4 L6,-4" fill="none" stroke="#E58A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="948" y="575" font-size="21" font-weight="800" fill="#F4F1EA">兼容上游</text><text x="884" y="628" font-size="15.5" font-weight="400" fill="#C4BEB0">保留 CodexHost 0.20.0+ 插件，</text><text x="884" y="654" font-size="15.5" font-weight="400" fill="#C4BEB0">插件 ID、配置文件名和远端目录不变</text></g></svg>
