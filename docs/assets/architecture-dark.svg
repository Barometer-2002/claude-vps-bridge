VPS</text><text x="858" y="446" font-size="14.5" font-weight="400" fill="#C4BEB0">原生会话：--resume / --fork-session</text><rect x="824" y="476" width="392" height="100" rx="14" fill="#34312C" stroke="#3D3A34" stroke-width="1.2"/><rect x="838" y="494" width="4" height="64" rx="2" fill="#948E81"/><text x="858" y="514" font-size="18" font-weight="800" fill="#F4F1EA">tool-bridge · workspace-guard</text><text x="858" y="540" font-size="14.5" font-weight="400" fill="#C4BEB0">私有 Unix Socket（0600）+ 会话令牌</text><text x="858" y="562" font-size="14.5" font-weight="400" fill="#C4BEB0">mcp-local.py 转发本机 MCP 调用</text><rect x="64" y="592" width="169.68000000000004" height="32" rx="16" fill="#34312C" stroke="#3D3A34" stroke-width="1.2"/><text x="148.84000000000003" y="612.9" font-size="14" font-weight="600" fill="#C4BEB0" text-anchor="middle">项目源码 · CLAUDE.md</text><rect x="243.68000000000004" y="592" width="181.72000000000006" height="32" rx="16" fill="#34312C" stroke="#3D3A34" stroke-width="1.2"/><text x="334.5400000000001" y="612.9" font-size="14" font-weight="600" fill="#C4BEB0" text-anchor="middle">PowerShell · 构建 · GPU</text><rect x="824" y="592" width="185.22" height="32" rx="16" fill="#34312C" stroke="#3D3A34" stroke-width="1.2"/><text x="916.61" y="612.9" font-size="14" font-weight="600" fill="#C4BEB0" text-anchor="middle">Tavily 联网搜索（可选）</text><line x1="462" y1="294" x2="818" y2="294" stroke="#E58A6B" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arA)"/><line x1="818" y1="410" x2="462" y2="410" stroke="#4FB58C" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arG)"/><rect x="577" y="250" width="126" height="30" rx="15" fill="#3A2A23" stroke="#5A3A2E" stroke-width="1.2"/><text x="640" y="269.9" font-size="14" font-weight="600" fill="#F0A58A" text-anchor="middle">消息与工具结果</text><rect x="561.74" y="366" width="156.52" height="30" rx="15" fill="#1F332B" stroke="#2F5A48" stroke-width="1.2"/><text x="640" y="385.9" font-size="14" font-weight="600" fill="#4FB58