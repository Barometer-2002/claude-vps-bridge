<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="T3 Claude VPS"><title>T3 Claude VPS</title><desc>在 T3 Code 中使用 VPS 上的官方 Claude Code，项目文件和工具留在 Windows，两端经 SSH 双向通道连接。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCFBF8"/><stop offset="1" stop-color="#F1EDE3"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D97757" stop-opacity="0.2"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#DDD6C7"/></pattern><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#7A6A50" flood-opacity="0.16"/></filter><marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#D97757"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1F7A5A"/></marker></defs><rect width="1280" height="340" rx="24" fill="url(#bg)"/><rect width="1280" height="340" rx="24" fill="url(#dots)" opacity="0.55"/><rect x="0.5" y="0.5" width="1279" height="339" rx="24" fill="none" stroke="#E7E1D4"/><g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif"><circle cx="1020" cy="170" r="360" fill="url(#glow)"/><g transform="translate(72 86)"><rect x="0" y="0" width="88" height="88" rx="24" fill="#1D1B18" stroke="#1D1B18" stroke-width="1.2" filter="url(#sh)"/><path d="M24,32 L40,46 L24,60 M46,62 H66" fill="none" stroke="#F4F1EA" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(84 6)"><circle r="21" fill="#D97757"/><path d="M0,-10 V10 M-8.66,-5 L8.66,5 M-8.66,5 L8.66,-5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/></g></g><text x="72" y="62" font-size="13" font-weight="700" fill="#B4532F" font-family="Cascadia Mono, JetBrains Mono, Consolas, SFMono-Regular, monospace" letter-spacing="1.6">VPS CLAUDE CODE × WINDOWS WORKSPACE</text><text x="190" y="150" font-size="70" font-weight="800" fill="#171612" letter-spacing="-1">T3 Claude VPS</text><text x="72" y="210" font-size="30" font-weight="700" fill="#171612">让 T3 Code 使用 VPS 上的官方 Claude Code</text><text x="72" y="250" font-size="19" font-weight="400" fill="#5A5549">模型会话与登录留在 VPS，源码、终端和本机 MCP 留在 Windows</text><rect x="72" y="280" width="145.96" height="34" rx="17" fill="#F4F0E7" stroke="#E2DCCF" stroke-width="1.2"/><text x="144.98000000000002" y="301.9" font-size="14" font-weight="600" fill="#5A5549" text-anchor="middle">T3 Code 原生接入</text><rect x="229.96" y="280" width="123.28" height="34" rx="17" fill="#F4F0E7" stroke="#E2DCCF" stroke-width="1.2"/><text x="291.6" y="301.9" font-size="14" font-weight="600" fill="#5A5549" text-anchor="middle">标准 ACP 包装</text><rect x="365.24" y="280" width="134.90000000000003" height="34" rx="17" fill="#F4F0E7" stroke="#E2DCCF" stroke-width="1.2"/><text x="432.69000000000005" y="301.9" font-size="14" font-weight="600" fill="#5A5549" text-anchor="middle">CodexHost 可选</text><rect x="700" y="66" width="230" height="208" rx="20" fill="#FFFFFF" stroke="#E7E1D4" stroke-width="1.2" filter="url(#sh)"/><circle cx="722" cy="92" r="4.5" fill="#E2DCCF"/><circle cx="738" cy="92" r="4.5" fill="#E2DCCF"/><circle cx="754" cy="92" r="4.5" fill="#E2DCCF"/><text x="910" y="96" font-size="11.5" font-weight="700" fill="#8C867A" text-anchor="end" font-family="Cascadia Mono, JetBrains Mono, Consolas, SFMono-Regular, monospace" letter-spacing="1.2">WINDOWS</text><text x="722" y="144" font-size="22" font-weight="800" fill="#171612">项目与工具</text><text x="722" y="170" font-size="15" font-weight="400" fill="#5A5549">源码 · 终端 · MCP</text><rect x="722" y="190" width="120" height="8" rx="4" fill="#D97757"/><rect x="850" y="190" width="60" height="8" rx="4" fill="#E2DCCF"/><rect x="722" y="208" width="188" height="8" rx="4" fill="#E2DCCF"/><line x1="722" y1="234" x2="908" y2="234" stroke="#E2DCCF"/><circle cx="728" cy="254" r="4" fill="#1F7A5A"/><text x="740" y="259" font-size="15" font-weight="700" fill="#1F7A5A">本机读写与构建</text><rect x="1010" y="66" width="230" height="208" rx="20" fill="#FFFFFF" stroke="#E7E1D4" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(1032 92)"><path d="M0,-6 V6 M-5.196,-3 L5.196,3 M-5.196,3 L5.196,-3" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" fill="none"/></g><text x="1220" y="96" font-size="11.5" font-weight="700" fill="#B4532F" text-anchor="end" font-family="Cascadia Mono, JetBrains Mono, Consolas, SFMono-Regular, monospace" letter-spacing="1.2">LINUX VPS</text><rect x="1032" y="118" width="58" height="58" rx="15" fill="#FBEDE6" stroke="#F0CFC2" stroke-width="1.2"/><g transform="translate(1061 147)"><path d="M0,-14 V14 M-12.124,-7 L12.124,7 M-12.124,7 L12.124,-7" stroke="#D97757" stroke-width="3.4" stroke-linecap="round" fill="none"/></g><text x="1102" y="144" font-size="20" font-weight="800" fill="#171612">Claude Code</text><text x="1102" y="168" font-size="15" font-weight="400" fill="#5A5549">官方 CLI</text><text x="1032" y="206" font-size="15" font-weight="400" fill="#5A5549">登录与模型请求</text><line x1="1032" y1="234" x2="1218" y2="234" stroke="#E2DCCF"/><circle cx="1038" cy="254" r="4" fill="#D97757"/><text x="1050" y="259" font-size="15" font-weight="700" fill="#B4532F">从 VPS 发起请求</text><line x1="940" y1="136" x2="1000" y2="136" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arA)"/><line x1="1000" y1="204" x2="940" y2="204" stroke="#1F7A5A" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arG)"/><rect x="946.3" y="157" width="47.4" height="26" rx="13" fill="#FFFFFF" stroke="#E2DCCF" stroke-width="1.2"/><text x="970" y="174.55" font-size="13" font-weight="600" fill="#5A5549" text-anchor="middle" font-family="Cascadia Mono, JetBrains Mono, Consolas, SFMono-Regular, monospace">SSH</text></g></svg>
