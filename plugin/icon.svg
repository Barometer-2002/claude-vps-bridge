<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">T3 Claude VPS</title>
  <desc id="desc">双层玻璃终端与暖陶红星芒图标：象征本地 Windows 终端直连远端 VPS 官方 Claude Code</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="0" x2="54" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24221F"/>
      <stop offset="100%" stop-color="#11100F"/>
    </linearGradient>
    <radialGradient id="glow" cx="44" cy="20" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outerRim" x1="32" y1="1" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="vpsTile" x1="24" y1="9" x2="54" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F19877"/>
      <stop offset="52%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#BD5736"/>
    </linearGradient>
    <linearGradient id="vpsRim" x1="39" y1="9.5" x2="39" y2="39.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="localTile" x1="10" y1="24" x2="40" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E2C28"/>
      <stop offset="100%" stop-color="#181715"/>
    </linearGradient>
    <linearGradient id="localRim" x1="25" y1="24.5" x2="25" y2="54.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="vpsClip">
      <rect x="24" y="9.5" width="30" height="30" rx="8.5"/>
    </clipPath>
  </defs>

  <!-- Sculpted Obsidian Squircle -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#outerRim)" stroke-width="1"/>

  <!-- Back-Right Tile: Remote VPS Claude -->
  <rect x="24" y="9.5" width="30" height="30" rx="8.5" fill="url(#vpsTile)"/>
  <rect x="24.5" y="10" width="29" height="29" rx="8" stroke="url(#vpsRim)" stroke-width="1"/>

  <!-- Crisp 6-Ray Geometric Spark (completely clear of front tile) -->
  <g transform="translate(43.8 19.2)" stroke="#FFFDF9" stroke-width="2.35" stroke-linecap="round">
    <line x1="0" y1="-4.9" x2="0" y2="4.9"/>
    <line x1="-4.25" y1="-2.45" x2="4.25" y2="2.45"/>
    <line x1="4.25" y1="-2.45" x2="-4.25" y2="2.45"/>
  </g>

  <!-- Soft Layered Separation Shadow clipped to Back Tile -->
  <g clip-path="url(#vpsClip)">
    <rect x="11.5" y="23" width="31" height="31" rx="9.5" fill="#0B0A09" fill-opacity="0.42"/>
  </g>

  <!-- Front-Left Tile: Local Windows / T3 Terminal -->
  <rect x="10" y="24.5" width="30" height="30" rx="8.5" fill="url(#localTile)"/>
  <rect x="10.5" y="25" width="29" height="29" rx="8" stroke="url(#localRim)" stroke-width="1.1"/>

  <!-- Crisp Local Terminal Prompt >_ -->
  <path d="M17.2 35L22.6 39.5L17.2 44" stroke="#FAF8F4" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="25.6" y1="44" x2="32.8" y2="44" stroke="#EC916F" stroke-width="2.9" stroke-linecap="round"/>
</svg>
