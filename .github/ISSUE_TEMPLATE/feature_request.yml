name: 功能建议
description: 描述你要完成的工作，以及目前遇到的限制。
title: '[建议] '
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你通过哪个客户端完成什么任务？请举一个现有流程处理不了的例子。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述希望在客户端看到的行为，以及怎样验证它解决了问题。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 相关环境
      description: 写明接入方式、客户端版本和相关可选工具。请使用脱敏示例。
