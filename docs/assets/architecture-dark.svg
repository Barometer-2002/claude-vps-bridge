    <rect x="728" y="236" width="142" height="22" rx="6" fill="#171311" stroke="#4E3126"/>
    <text x="799" y="251" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#F4A78B">claude-stream-relay</text>
    <rect x="878" y="236" width="112" height="22" rx="6" fill="#171311" stroke="#3B3531"/>
    <text x="934" y="251" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600" fill="#D4CFC7">remote-server</text>
    <text x="728" y="274" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#A69890">workspace-guard.py · mcp-local.py</text>

    <!-- Tool Bridge -->
    <rect x="712" y="298" width="294" height="62" rx="10" fill="#1E1D1B" stroke="#302E2A"/>
    <text x="728" y="323" font-size="13.5" font-weight="700" fill="#F2EFE9">tool-bridge.mjs 私有通道</text>
    <text x="728" y="344" font-size="12" fill="#9A948A">0600 Unix Socket · 会话令牌 · 工具允许列表</text>

    <!-- Anthropic OAuth Credentials -->
    <rect x="712" y="374" width="294" height="66" rx="10" fill="#231B15" stroke="#593B25"/>
    <text x="728" y="400" font-size="13.5" font-weight="750" fill="#F6B688">VPS 上的 Claude 登录会话</text>
    <text x="728" y="422" font-size="12" fill="#D59A70">CLI 使用 VPS 上的登录配置</text>

    <!-- Native Session & Optional Tavily -->
    <rect x="712" y="454" width="294" height="86" rx="10" fill="#1C1B19" stroke="#2D2B27"/>
    <text x="728" y="479" font-size="13" font-weight="700" fill="#E6E3DC">原生会话续接</text>
    <text x="990" y="479" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#9A948A">--resume · --fork-session</text>
    <line x1="728" y1="496" x2="990" y2="496" stroke="#2A2825" stroke-width="1"/>
    <text x="728" y="522" font-size="13" font-weight="600" fill="#E6E3DC">Tavily 联网搜索</text>
    <text x="990" y="522" text-anchor="end" font-size="11.5" fill="#9A948A">可选，VPS 直连</text>

    <!-- CONNECTOR: VPS <-> ANTHROPIC (x=1026..1084, span=58px) -->
    <text x="1055" y="198" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="600" fill="#8C877D">HTTPS</text>
    <path d="M1026 212H1078" stroke="#9A948A" stroke-width="1.8" marker-end="url(#mStoneD)"/>
    <path d="M1084 238H1032" stroke="#9A948A" stroke-width="1.8" marker-end="url(#mStoneD)"/>

    <!-- ZONE 3: ANTHROPIC & ISOLATION SUMMARY (x=1084..1240, exact top y=108 & bottom y=558 alignment) -->
    <rect x="1084" y="108" width="156" height="176" rx="16" fill="#171614" stroke="#2B2926" stroke-width="1.2"/>
    <g transform="translate(1162 162)" stroke="#EB8E6C" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-7.5" x2="0" y2="7.5"/>
      <line x1="-6.5" y1="-3.75" x2="6.5" y2="3.75"/>
      <line x1="6.5" y1="-3.75" x2="-6.5" y2="3.75"/>
    </g>
    <text x="1162" y="200" text-anchor="middle" font-size="16" font-weight="750" fill="#FAF8F4">Anthropic</text>
    <text x="1162" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F09878">官方模型服务</text>
    <rect x="1120" y="240" width="84" height="22" rx="11" fill="#211F1C" stroke="#34312D"/>
    <text x="1162" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#A6A096">VPS 发起</text>

    <!-- Balanced Bottom Right Card: Isolation Principles (aligns cleanly to y=558) -->
    <rect x="1084" y="298" width="156" height="260" rx="16" fill="#171614" stroke="#2B2926" stroke-width="1.2"/>
    <text x="1102" y="328" font-size="13" font-weight="750" fill="#F2EFE9">两端的职责</text>
    <line x1="1102" y1="342" x2="1222" y2="342" stroke="#282623" stroke-width="1"/>

    <text x="1102" y="366" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#EB8E6C">01 / SESSIONS</text>
    <text x="1102" y="386" font-size="12.5" font-weight="600" fill="#F2EFE9">Claude Code 会话</text>
    <text x="1102" y="405" font-size="11.5" fill="#9A948A">VPS 管理登录</text>
    <text x="1102" y="421" font-size="11.5" fill="#9A948A">Windows 连接 MCP</text>

    <line x1="1102" y1="438" x2="1222" y2="438" stroke="#262421" stroke-width="1"/>
    <text x="1102" y="460" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#4ADE80">02 / WORKSPACE</text>
    <text x="1102" y="480" font-size="12.5" font-weight="600" fill="#F2EFE9">Windows 项目</text>
    <text x="1102" y="499" font-size="11.5" fill="#9A948A">按需传输文件内容</text>
    <text x="1102" y="515" font-size="11.5" fill="#9A948A">及工具调用结果</text>
    <text x="1102" y="540" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#7D786E">Plan Fail-Closed</text>

    <!-- FOOTER -->
    <line x1="40" y1="578" x2="1240" y2="578" stroke="#252320" stroke-width="1"/>
    <text x="40" y="608" font-size="12.5" fill="#8C877D">Windows 通过 SSH 接收工具请求并返回结果。会话文字、附件和工具返回的数据可进入模型请求。</text>
    <text x="1240" y="608" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7D786E">v1.0.0 · Upstream base: claude-vps-bridge 0.14.1</text>
  </g>
