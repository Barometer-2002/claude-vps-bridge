<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">T3 Claude VPS</title>
  <desc id="desc">Clawd 轮廓与连接 Windows 本机和 Linux VPS 的加密双向 SSH 桥接图标</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#152830"/>
      <stop offset="100%" stop-color="#0D191F"/>
    </linearGradient>
    <linearGradient id="clawd" x1="12" y1="4" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EB8A68"/>
      <stop offset="100%" stop-color="#D9704E"/>
    </linearGradient>
    <linearGradient id="link" x1="22" y1="50" x2="42" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" stroke="#26434E" stroke-width="1.5"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  <!-- Clawd silhouette (LobeHub Icons MIT, preserved path & proportions) -->
  <g transform="translate(9.5 1.5) scale(1.88)">
    <path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="url(#clawd)" fill-rule="evenodd"/>
  </g>
  <!-- Windows terminal -> SSH duplex -> Linux VPS -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8.5" y="45" width="13.5" height="10.5" rx="2.2" fill="#17303A" stroke="#7FA4B0" stroke-width="1.5"/>
    <path d="m11.5 48.2 2.2 2.1-2.2 2.1m4 0h3.2" stroke="#E2F1F5" stroke-width="1.5"/>
    <path d="M25 48.4h13.5l-2.3-2.2M39 52.2H25.5l2.3 2.2" stroke="url(#link)" stroke-width="1.7"/>
    <rect x="42" y="44.5" width="13.5" height="11.5" rx="2.2" fill="#17303A" stroke="#7FA4B0" stroke-width="1.5"/>
    <path d="M42 50.25h13.5" stroke="#7FA4B0" stroke-width="1.4"/>
    <circle cx="45.8" cy="47.4" r="1" fill="#2DD4BF"/>
    <circle cx="45.8" cy="53.1" r="1" fill="#38BDF8"/>
    <path d="M49 47.4h3.6M49 53.1h3.6" stroke="#A7C4CE" stroke-width="1.3"/>
  </g>
</svg>
